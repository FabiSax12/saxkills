name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# TODO(owner): pin actions to full commit SHAs, keeping the tag in a trailing comment.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
